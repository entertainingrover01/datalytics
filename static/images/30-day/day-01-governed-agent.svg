<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The Agent Is a New Consumer — Behind the Same Governed Interface</text>

  <!-- Agent -->
  <rect x="40" y="100" width="220" height="140" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">AI Agent</text>
  <text x="150" y="166" text-anchor="middle" font-size="14" fill="#334155">Asks a question in</text>
  <text x="150" y="190" text-anchor="middle" font-size="14" fill="#334155">plain English</text>
  <text x="150" y="214" text-anchor="middle" font-size="14" fill="#334155">Generates SQL</text>

  <!-- Governed interface -->
  <rect x="330" y="100" width="300" height="140" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Governed Interface</text>
  <text x="480" y="166" text-anchor="middle" font-size="14" fill="#334155">Guardrails: SELECT-only,</text>
  <text x="480" y="190" text-anchor="middle" font-size="14" fill="#334155">schema allowlist, LIMIT cap</text>
  <text x="480" y="214" text-anchor="middle" font-size="14" fill="#334155">Blocked queries never run</text>

  <!-- Data platform -->
  <rect x="700" y="100" width="260" height="140" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="830" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#134e4a">Data Platform</text>
  <text x="830" y="166" text-anchor="middle" font-size="14" fill="#334155">Lakehouse / warehouse</text>
  <text x="830" y="190" text-anchor="middle" font-size="14" fill="#334155">Read-only role</text>
  <text x="830" y="214" text-anchor="middle" font-size="14" fill="#334155">Read-only transaction</text>

  <!-- Other consumers -->
  <rect x="1020" y="100" width="140" height="140" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1090" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#0c4a6e">Others</text>
  <text x="1090" y="166" text-anchor="middle" font-size="14" fill="#334155">Dashboards</text>
  <text x="1090" y="190" text-anchor="middle" font-size="14" fill="#334155">Analysts</text>
  <text x="1090" y="214" text-anchor="middle" font-size="14" fill="#334155">ML models</text>

  <!-- Arrows -->
  <line x1="262" y1="170" x2="326" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="632" y1="170" x2="696" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="962" y1="170" x2="1016" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Audit log -->
  <rect x="330" y="290" width="630" height="70" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="645" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Audit Log — every request recorded</text>
  <text x="645" y="344" text-anchor="middle" font-size="14" fill="#334155">Question · generated SQL · guardrail verdict · rows returned</text>
  <line x1="480" y1="242" x2="480" y2="286" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
  <line x1="830" y1="242" x2="830" y2="286" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
</svg>
